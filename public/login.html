<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        fieldset {
            width: 350px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        #mylink {
            font-size: 20px;
        }

        h1 {
            color: blue;
        }
    </style>
</head>

<body align="center">

    <header>
        <h1>Student Login Portal</h1> <!-- NEW -->
        <p>Welcome student Please login to continue.</p> <!-- NEW -->
    </header>

    <form action="/login" method="POST">

        <fieldset>

            <legend><b>Login Form</b></legend> <!-- NEW -->

            <label>Email ID</label><br>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="abc@example.com"
                required>

            <br><br>

            <label>Password</label><br>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required>

            <br><br>

            <button type="reset">Reset</button>
            <button type="submit">Login</button> <!-- Changed -->

        </fieldset>

    </form>

    <br>

    <p>Don't have an account?</p> <!-- NEW -->

    <a id="mylink" href="./registration.html">
        Register Here
    </a>

</body>

</html>
